# E1-1：推送/PR 自动编译、测试与构建检查
# Backend: mvn test | Admin: typecheck + build | Miniapp: prod mock 门禁
name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Spring bean constructor cycle check
        run: npm run check:spring-bean-cycles

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # maven-wrapper.jar 未入库，CI 使用 setup-java 自带的 Maven
      - name: Compile, test and package
        run: mvn -B test

  miniapp-guard:
    name: Miniapp Mock Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check prod mock policy
        run: npm run check:prod-mock

  miniapp-quality:
    name: Miniapp Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: WXML check
        run: npm run check:wxml

      - name: Admin menu icon check
        run: npm run check:admin-menu-icons

      - name: Press feedback check
        run: npm run check:press-feedback

      - name: TabBar route consistency check
        run: npm run check:tabbar-routes

      - name: UI copy check
        run: npm run check:ui-copy

      - name: rpx scaling check
        run: npm run check:rpx-scaling

      - name: Text contrast check
        run: npm run check:contrast

      - name: Touch target check
        run: npm run check:touch-targets

      - name: Miniapp utils tests
        run: npm run test:miniapp-utils

  deploy-env-guard:
    name: Deploy Env Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy env unit tests
        run: npm run test:deploy-env

      - name: Staging default config check
        run: npm run check:deploy-env

      - name: Navigate appids sync test
        run: npm run test:sync-navigate-appids

      - name: Release gate regression test
        run: npm run test:release-gate

      - name: Member delete guidance check
        run: npm run check:member-delete-guidance

      - name: Member delete guidance tests
        run: npm run test:member-delete-guidance

      - name: Recycle bin view checks
        run: npm run check:recycle-bin-view && npm run test:recycle-bin-list-request

      - name: Delete impact request checks
        run: npm run check:delete-impact-request && npm run test:delete-impact-request

      - name: Member import transaction check
        run: npm run check:member-import-transaction

      - name: Spring bean cycle gate test
        run: npm run test:spring-bean-cycles

  admin:
    name: Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  glb-tools:
    name: GLB Tools (OBJ→GLB 转换器)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exhibits/模型转换
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 与合伙人机器上的安装说明保持一致，不额外装 scipy
      - name: Install dependencies
        run: pip install trimesh pillow numpy

      - name: Unit tests
        run: |
          python glb_paths.test.py
          python glb_utils.test.py
          python batch_glb.test.py
          python input_scan.test.py
          python convert_cli.test.py
          python launch_gui.test.py
          python obj2glb_gui.test.py

  exhibits:
    name: Exhibits (unit + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exhibits
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: exhibits/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pre-pull Debian image for permissions integration
        run: |
          for i in 1 2 3 4 5; do
            docker pull debian:bookworm-slim && exit 0
            docker pull public.ecr.aws/docker/library/debian:bookworm-slim && exit 0
            echo "docker pull attempt $i failed, retrying in ${i}0s..."
            sleep $((i * 10))
          done
          echo "Warning: could not pre-pull Debian image; integration test will retry with fallback"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests, viewer sync, E2E
        run: npm run test:ci

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exhibits-playwright-${{ github.run_attempt }}
          path: |
            exhibits/test-results/
            exhibits/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

