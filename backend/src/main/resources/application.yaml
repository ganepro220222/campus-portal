spring:
  profiles:
    # 本地默认 dev；staging/prod 通过环境变量 SPRING_PROFILES_ACTIVE 注入
    active: ${SPRING_PROFILES_ACTIVE:dev}
  task:
    scheduling:
      # 调度任务分池并行，避免统计/清理长任务阻塞订阅消息与 ASR 轮询。
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: shuyuan-scheduling-
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: ${SERVER_PORT:8080}

# 应用版本：health 接口与 CI 可读取；生产建议注入 APP_VERSION
info:
  app:
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

shuyuan:
  jwt:
    # dev/docker 可保留本地默认值（启动会告警）；共享环境应通过 JWT_SECRET 覆盖。
    secret: ${JWT_SECRET:shuyuan-dev-jwt-secret-change-in-prod}
    expire-days: 7
    admin-expire-hours: ${JWT_ADMIN_EXPIRE_HOURS:8}
  wx:
    dev-mode: true
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    wxacode-cache-max-entries: 64
    wxacode-cache-ttl-seconds: 3600
  login:
    max-fail-attempts: 5
    lock-minutes: 5
    fail-window-minutes: 15
  rate-limit:
    enabled: true
    login-per-minute: 10
    wx-login-per-minute: 20
    admin-login-per-minute: 10
    enroll-per-minute: 5
    feedback-per-minute: 3
    feedback-per-day: 20
    # 小程序 AI 问答：每位学生每自然日。人数多少不改变个人体验（这是每人上限，不是共享池），
    # 20 次相当于一天完整用三轮，够用；数值同时写在交付与测试文档里，调整需一并更新。
    ai-per-day: ${AI_PER_DAY:20}
    wxacode-per-minute: 30
  ai:
    provider: ${AI_PROVIDER:fallback}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    model: ${AI_MODEL:glm-4.5-flash}
    # 后台 AI 文案辅助：每位管理员每自然日。润色/扩写/摘要/标题/英译共用这一个计数，
    # 而一篇动态的编辑器里就挂了标题、摘要、正文三处入口——按 20 算一天只够写四篇稿子。
    # 真正写稿的老师最多两三位，用的又是免费档模型，这里卡紧没有任何控费价值：
    # 就算两个人各自打满 100 次，一天也就两百次，成本仍然可以忽略。
    daily-limit: ${AI_DAILY_LIMIT:100}
    max-chunks: 5
    # 「这次检索到的资料够不够回答」的加权分下限。只决定要不要扣用户当天的问答次数，
    # 不决定是否回答——所以两个方向的误判都是温和的：判高了是少扣一次，判低了是维持现状。
    # 数值取自 BuiltinKnowledgeRetrievalTest 导出的实测分布（无关问题实测最高 3 分）。
    min-relevance-score: ${AI_MIN_RELEVANCE_SCORE:4}
  subscribe:
    enroll-success-template-id: ${WX_TMPL_ENROLL_SUCCESS:}
    enroll-approved-template-id: ${WX_TMPL_ENROLL_APPROVED:}
    activity-remind-template-id: ${WX_TMPL_ACTIVITY_REMIND:}
    outbox-batch-size: ${SUBSCRIBE_OUTBOX_BATCH_SIZE:50}
    outbox-max-attempts: ${SUBSCRIBE_OUTBOX_MAX_ATTEMPTS:10}
    outbox-stale-minutes: ${SUBSCRIBE_OUTBOX_STALE_MINUTES:5}
    outbox-retry-base-seconds: ${SUBSCRIBE_OUTBOX_RETRY_BASE_SECONDS:30}
    enroll-success-fields:
      title: thing1
      start-time: time3
    enroll-approved-fields:
      phrase: phrase1
      title: thing8
      start-time: time11
    activity-remind-fields:
      title: thing1
      phrase: phrase2
      start-time: time4
  # 日志类数据保留期（天）。设 0 或负数 = 该表不清理。
  # event_log 明细的统计价值在 StatsDailyJob 聚合进 stat_daily 之后就用尽了；
  # sys_log 有审计属性，删除策略建议先与甲方确认后再调低。
  retention:
    enabled: ${RETENTION_ENABLED:true}
    event-log-days: ${RETENTION_EVENT_LOG_DAYS:90}
    sys-log-days: ${RETENTION_SYS_LOG_DAYS:365}
    outbox-sent-days: ${RETENTION_OUTBOX_SENT_DAYS:30}
    outbox-failed-days: ${RETENTION_OUTBOX_FAILED_DAYS:180}
    batch-size: ${RETENTION_BATCH_SIZE:1000}
    max-batches-per-run: ${RETENTION_MAX_BATCHES_PER_RUN:200}
  alert:
    enabled: ${ALERT_ENABLED:false}
    webhook-url: ${ALERT_WEBHOOK_URL:}
    window-minutes: ${ALERT_WINDOW_MINUTES:5}
    error-rate-percent: ${ALERT_ERROR_RATE_PERCENT:1}
    min-sample-size: ${ALERT_MIN_SAMPLE_SIZE:20}
    cooldown-minutes: ${ALERT_COOLDOWN_MINUTES:15}
  cors:
    allowed-origin-patterns: []
  security:
    trust-forwarded-headers: false
  asr:
    provider: ${ASR_PROVIDER:none}
    access-key-id: ${ASR_ACCESS_KEY_ID:}
    access-key-secret: ${ASR_ACCESS_KEY_SECRET:}
    app-key: ${ASR_APP_KEY:}
    region: ${ASR_REGION:cn-shanghai}
    poll-batch-size: ${ASR_POLL_BATCH_SIZE:50}
    poll-timeout-hours: ${ASR_POLL_TIMEOUT_HOURS:24}
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    internal-endpoint: ${OSS_INTERNAL_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key: ${OSS_ACCESS_KEY:}
    secret-key: ${OSS_SECRET_KEY:}
    cdn-domain: ${OSS_CDN_DOMAIN:}
    cdn-auth-enabled: ${OSS_CDN_AUTH_ENABLED:false}
    cdn-auth-type: ${OSS_CDN_AUTH_TYPE:A}
    cdn-auth-key: ${OSS_CDN_AUTH_KEY:}
    sign-expire-seconds: ${OSS_SIGN_EXPIRE_SECONDS:7200}
    media-sign-expire-seconds: ${OSS_MEDIA_SIGN_EXPIRE_SECONDS:900}
    video-sign-expire-seconds: ${OSS_VIDEO_SIGN_EXPIRE_SECONDS:14400}
    max-upload-bytes: ${OSS_MAX_UPLOAD_BYTES:209715200}
    direct-upload-enabled: ${OSS_DIRECT_UPLOAD_ENABLED:false}
    direct-video-max-bytes: ${OSS_DIRECT_VIDEO_MAX_BYTES:2147483648}
    image-max-bytes: ${OSS_IMAGE_MAX_BYTES:20971520}
    subtitle-max-bytes: ${OSS_SUBTITLE_MAX_BYTES:10485760}
    direct-policy-expire-seconds: ${OSS_DIRECT_POLICY_EXPIRE_SECONDS:3600}
    orphan-min-age-hours: ${OSS_ORPHAN_MIN_AGE_HOURS:48}
    # 默认关闭：一二期（换素材删旧、彻底删除清对象）在预发验证通过后，再设 true 开启每日孤儿扫描
    orphan-sweep-enabled: ${OSS_ORPHAN_SWEEP_ENABLED:false}
    orphan-sweep-max-deletes: ${OSS_ORPHAN_SWEEP_MAX_DELETES:80}

mybatis-plus:
  configuration:
    # 数据库字段下划线自动转 Java 驼峰命名
    map-underscore-to-camel-case: true
    # SQL 日志由各 profile 单独配置（dev 开启，staging/prod 关闭）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %X{traceId} %logger{36} - %msg%n"

# Actuator 仅内部使用，不对外暴露 /actuator 端点（health 走 /api/v1/health）
management:
  endpoints:
    web:
      exposure:
        include: none
  endpoint:
    health:
      show-details: never

# OpenAPI（dev/staging 默认开启；prod 在 profile 中关闭）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  show-actuator: false