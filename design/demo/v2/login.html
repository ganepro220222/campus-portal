<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>中华文化书院 · 登录（书院·檐棂印）</title>
<link rel="stylesheet" href="shuyuan.css">
</head>
<body>

<div class="phone login">

  <div class="login-lattice"></div>

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="16" height="11" viewBox="0 0 16 11"><g fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4.3" y="5" width="3" height="6" rx=".6"/><rect x="8.6" y="2.6" width="3" height="8.4" rx=".6"/><rect x="12.9" y="0" width="3" height="11" rx=".6"/></g></svg>
      <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 9.6 1 3.6a9.2 9.2 0 0 1 13 0Z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="8.6" r="1.2" fill="currentColor"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11"><rect x=".5" y=".5" width="19" height="10" rx="2.6" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="14.5" height="7" rx="1.4" fill="currentColor"/><path d="M21.4 3.6v3.8a2.1 2.1 0 0 0 0-3.8Z" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>

  <!-- 深色页上的檐：只留线，不留面 -->
  <svg style="display:block;width:100%;height:52px;flex:none;margin-top:-4px" viewBox="0 0 375 52" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,0 H375 V14 C265,40 110,40 0,14 Z" fill="#3A2A19"/>
    <path d="M0,8 C110,34 265,34 375,8" fill="none" stroke="#000" stroke-width="9" stroke-dasharray="1.8 8" opacity=".3"/>
    <path d="M0,14 C110,40 265,40 375,14" fill="none" stroke="#C0994E" stroke-width="1.2" opacity=".8"/>
    <path d="M0,17.4 C110,43.4 265,43.4 375,17.4" fill="none" stroke="#B08658" stroke-width="6.2" stroke-linecap="round" stroke-dasharray="0.01 15" opacity=".95"/>
    <path d="M0,24.6 C110,50.6 265,50.6 375,24.6" fill="none" stroke="#8A6038" stroke-width="5" stroke-dasharray="4.4 10.6" opacity=".8"/>
  </svg>

  <!-- 印章「钤」在一方纸上 —— 校方印章 + 纸，是这一页的视觉中心 -->
  <div style="width:78px;height:78px;margin:22px auto 0;background:#F3ECDC;border-radius:3px;
              display:flex;align-items:center;justify-content:center;
              box-shadow:0 6px 22px rgba(0,0,0,.34), inset 0 0 0 1px rgba(107,74,50,.18);">
    <img src="../../brand/logo/extracted/seal-maroon.png" alt="书院印" style="width:52px;height:52px;object-fit:contain">
  </div>

  <div class="login-brand" style="margin-top:26px">
    <img src="../../brand/logo/extracted/academy-cn-cream.png" alt="中华文化书院">
    <div class="login-div"><i></i><span>❖</span><i></i></div>
    <div class="login-en">Academy of Chinese Culture</div>
  </div>

  <div class="form">
    <div class="field">
      <span class="f-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8.4" r="4"/><path d="M4.6 20.2a7.4 7.4 0 0 1 14.8 0"/></svg></span>
      请输入账号
    </div>
    <div class="field">
      <span class="f-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"/></svg></span>
      <span style="flex:1">请输入密码</span>
      <span class="f-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></span>
    </div>
    <div class="forgot">忘记密码</div>
    <div class="btn-primary song">登 录</div>
    <div class="login-or">其他登录方式</div>
    <div class="btn-ghost">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M9.2 3.2C5.2 3.2 2 6 2 9.4c0 1.9 1.1 3.6 2.8 4.8l-.7 2.2 2.5-1.3c.8.2 1.7.4 2.6.4h.6a5.4 5.4 0 0 1-.2-1.5c0-3.2 3-5.7 6.8-5.7h.6C16.3 5.2 13.1 3.2 9.2 3.2Zm-2.4 3a.9.9 0 1 1 0 1.9.9.9 0 0 1 0-1.9Zm4.9 0a.9.9 0 1 1 0 1.9.9.9 0 0 1 0-1.9Z"/><path d="M22 14c0-2.7-2.7-4.9-6-4.9s-6 2.2-6 4.9 2.7 4.9 6 4.9c.7 0 1.4-.1 2-.3l2 1-.5-1.8c1.5-.9 2.5-2.3 2.5-3.8Zm-8-1.6a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5Zm4 0a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5Z"/></svg>
      微信授权登录
    </div>
  </div>

  <div class="login-foot">
    <img class="login-emblem" src="../../brand/logo/school-emblem.png" alt="校徽">
    <div class="lf-1 song">校园学习与活动服务平台</div>
    <div class="lf-2">线上线下相结合 · 随时随地学习</div>
  </div>

</div>

<div class="note">
  <b>方案「书院 · 檐棂印」· 登录页</b><br>
  深色不是黑，是<b>老木色</b>；棂格用径向遮罩只在中上部浮现，往四周化开，不满屏。<br>
  视觉中心是<b>校方印章钤在一方纸上</b>——纸给了印章对比度，也是"印"这个装置的最大一次亮相。<br>
  书法字用<b>米白版</b>压深色；登录按钮取印章同一个朱砂色；校徽退到页脚小尺寸，不抢书法字。
</div>

</body>
</html>
