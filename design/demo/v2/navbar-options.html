<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顶栏比稿 · 书院 · 檐棂印</title>
<link rel="stylesheet" href="shuyuan.css">
<style>
  /* 这一页是比稿，不是产品页：只做三个方向的顶栏，下面统一接同一段正文，
     好让高度差一眼看得出来。页面自己的样式都写在这里，不污染 shuyuan.css。 */
  body { background: var(--wood-20); padding: 24px 0 60px; }
  .board { display: flex; gap: 26px; justify-content: center; align-items: flex-start;
           flex-wrap: wrap; max-width: 1360px; margin: 0 auto; }
  .col { width: 375px; }
  .col > h2 { font-size: 15px; color: var(--wood-85); margin: 0 0 4px;
              font-family: 'ShuyuanSong','Noto Serif SC','Songti SC','STSong','SimSun',serif; }
  .col > p  { font-size: 12px; line-height: 1.7; color: var(--wood-85); opacity: .8;
              margin: 0 0 10px; min-height: 60px; }
  .h-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 2px;
           background: var(--paper-card); color: var(--jin-70);
           box-shadow: inset 0 0 0 1px var(--jin-20); margin-left: 6px; }

  .ph { position: relative; width: 375px; height: 460px; overflow: hidden;
        background: var(--paper); border-radius: 10px;
        box-shadow: 0 8px 24px rgba(74,50,30,.22); }

  /* 微信状态栏 + 胶囊：比稿里必须画出来，顶栏的高度是被它们框死的 */
  .statusbar { height: 44px; display: flex; align-items: center;
               justify-content: space-between; padding: 0 16px;
               font-size: 12.5px; letter-spacing: .3px; position: relative; z-index: 8; }
  .capsule { position: absolute; left: 281px; top: 48px; width: 87px; height: 32px;
             border-radius: 16px; z-index: 30; pointer-events: none;
             background: rgba(255,255,255,.62); backdrop-filter: blur(3px);
             box-shadow: inset 0 0 0 1px rgba(60,48,30,.30);
             display: flex; align-items: center; justify-content: space-around; }
  .capsule i { display: block; width: 3px; height: 3px; border-radius: 50%;
               background: var(--ink); }
  .capsule .dots { display: flex; gap: 3.5px; }
  .capsule .ring { width: 13px; height: 13px; border-radius: 50%;
                   box-shadow: inset 0 0 0 1.4px var(--ink); position: relative; }
  .capsule .ring::after { content: ''; position: absolute; inset: 3.4px;
                          border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--ink); }

  /* 返回键：三个方向共用同一枚，形制取角叶的金棕 */
  .back { position: absolute; left: 12px; width: 32px; height: 32px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; z-index: 9;
          background: rgba(252,250,244,.80);
          box-shadow: 0 1px 4px rgba(96,78,44,.16), inset 0 0 0 1px rgba(150,120,66,.26); }
  .back svg { width: 17px; height: 17px; display: block; }

  .ttl { font-family: 'ShuyuanSong','Noto Serif SC','Songti SC','STSong','SimSun',serif;
         font-size: 17px; letter-spacing: 2px; color: var(--ink); }

  /* 正文占位：三栏一样，用来看顶栏吃掉多少 */
  .body { padding: 14px 20px 0; }
  .body .ln { height: 9px; border-radius: 2px; background: var(--paper-2); margin-bottom: 11px; }
  .body .ln.s { width: 62%; }
  .body .card { margin-top: 14px; height: 96px; border-radius: 6px;
                background: var(--paper-card); box-shadow: var(--shadow-sm);
                border: 1px solid var(--line-soft); }
  .ruler { position: absolute; left: 0; right: 0; z-index: 25; pointer-events: none;
           border-top: 1px dashed rgba(158,43,37,.55); }
  .ruler span { position: absolute; right: 6px; top: -15px; font-size: 10.5px;
                color: var(--zhu); background: rgba(255,251,242,.85); padding: 0 4px;
                border-radius: 2px; }

  /* ── 甲：满檐 ───────────────────────────────── */
  .a .top { position: relative; }
  .a .eavewrap { margin-top: -2px; }
  .a .eavewrap svg { display: block; width: 100%; height: 46px; }
  .a .titlerow { position: relative; height: 40px; display: flex; align-items: center;
                 justify-content: center; background: var(--paper); }

  /* ── 乙：檐口 ───────────────────────────────── */
  .b .top { position: relative; background: var(--paper); }
  .b .titlerow { position: relative; height: 44px; display: flex; align-items: center;
                 justify-content: center; }
  .b .yk svg { display: block; width: 100%; height: 18px; }

  /* ── 丙：匾额 ───────────────────────────────── */
  .c .top { position: relative; background: var(--paper); }
  .c .titlerow { position: relative; height: 54px; display: flex; align-items: center;
                 justify-content: center; }
  /* 匾额是**深漆金字**，不是浅木配米白字。
     第一版做成了浅木底 + 米白字，量出来只有 2.23:1，远低于 AA；
     而且真的匾额本来就是黑漆/深栗底配泥金字，浅底才是不对的。
     现在：深漆底 8.27:1。 */
  .c .nb-plaque { position: relative; padding: 6px 28px; border-radius: 3px;
               background-color: #3A2F1E;
               /* 漆面是磨光的，不该有木纹。第一版套了 --grain-h，
                  在深色上变成一道道浅横条，像瓦楞板。改成一层很淡的漆光。 */
               background-image:
                 radial-gradient(120% 180% at 30% 8%, rgba(226,203,158,.16), transparent 62%),
                 linear-gradient(180deg, #46392A, #3A2F1E 58%, #2A2215);
               box-shadow: inset 0 0 0 1px rgba(203,168,107,.42),
                           inset 0 1px 0 rgba(226,203,158,.22),
                           0 2px 6px rgba(48,34,16,.34); }
  .c .nb-plaque .ttl { color: var(--jin-20); line-height: 22px;
                    text-shadow: 0 1px 0 rgba(20,14,6,.65); }
  /* 匾的四角用同一件角叶，尺寸收到 11px */
  .c .nb-plaque::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    --bj: 11px;
    background:
      var(--jiaoye-tl) left top / var(--bj) var(--bj) no-repeat,
      var(--jiaoye-tr) right top / var(--bj) var(--bj) no-repeat,
      var(--jiaoye-bl) left bottom / var(--bj) var(--bj) no-repeat,
      var(--jiaoye-br) right bottom / var(--bj) var(--bj) no-repeat;
  }
  .c .goldline { height: 3px; background:
      linear-gradient(180deg, var(--gold) 0 1.2px, rgba(94,70,35,.30) 1.2px 2px,
                      rgba(94,70,35,.10) 2px 3px); }
</style>
</head>
