<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>立体鉴赏</title>
<link rel="icon" href="data:," />
<style>
  :root { --gold:#c8a86a; --ink:#0f1118; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  /* 无障碍：键盘焦点可见（鼠标点击不显示，Tab 导航才显示） */
  :focus { outline:none; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .btn:focus-visible, .preset:focus-visible, .au-btn:focus-visible, .card-close:focus-visible, .err-btn:focus-visible { outline:2px solid #f4e6c8; outline-offset:2px; }
  .hs:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  html,body,#app { width:100%; height:100%; overflow:hidden; background:var(--ink); color:#eef0f5;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  #scene { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  [hidden] { display:none !important; }

  /* 顶栏 */
  .topbar { position:absolute; left:0; right:0; top:0; z-index:5; pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 16px) 20px 40px;
    background:linear-gradient(180deg, rgba(6,8,14,.72), rgba(6,8,14,0)); }
  .topbar-name { font-size:19px; font-weight:700; letter-spacing:1px; text-shadow:0 2px 12px rgba(0,0,0,.55); }
  .topbar-sub { margin-top:5px; font-size:12.5px; color:rgba(230,234,245,.72); max-width:80%;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .lang { position:absolute; top:calc(env(safe-area-inset-top) + 16px); right:16px; z-index:6; pointer-events:auto;
    display:flex; border:1px solid rgba(255,255,255,.22); border-radius:999px; overflow:hidden; font-size:12px; }
  .lang button { appearance:none; border:0; background:transparent; color:rgba(238,240,245,.7); padding:5px 12px; cursor:pointer; }
  .lang button.on { background:rgba(200,168,106,.22); color:#f4e6c8; }

  /* 提示 */
  .hint { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) translateY(66px);
    padding:8px 18px; border-radius:999px; background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
    font-size:12.5px; letter-spacing:1px; color:rgba(255,255,255,.86); z-index:6; pointer-events:none;
    opacity:0; transition:opacity .5s; }
  .hint.show { opacity:1; }

  /* 热点标记（双环：亮白内环 + 暗外描边 → 任意底色可见；强调色核心 = 身份色） */
  .hs-layer { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .hs { position:absolute; transform:translate(-50%,-50%); pointer-events:auto; cursor:pointer;
    width:var(--hs-size,26px); height:var(--hs-size,26px); will-change:transform,opacity; transition:opacity .25s; }
  .hs::before { content:""; position:absolute; inset:28%; border-radius:50%;
    background:var(--hs-color,#c8a86a); border:2px solid rgba(255,255,255,.95);
    box-shadow:0 0 0 3px rgba(0,0,0,.4), 0 0 10px 2px var(--hs-glow,rgba(200,168,106,.55)); }
  .hs::after { content:""; position:absolute; inset:28%; border-radius:50%;
    border:1.5px solid var(--hs-color,#c8a86a); animation:pulse 2.4s ease-out infinite; }
  .hs.no-pulse::after { animation:none; opacity:0; }
  .hs.active::before { background:#fff; border-color:#fff;
    box-shadow:0 0 0 3px rgba(0,0,0,.45), 0 0 12px 3px rgba(255,255,255,.5); }
  @keyframes pulse { 0%{transform:scale(1);opacity:.65} 100%{transform:scale(2.4);opacity:0} }
  @media (prefers-reduced-motion:reduce){ .hs::after{ animation:none; opacity:0 } }

  /* 底部工具条 */
  .hud { position:absolute; left:0; right:0; bottom:0; z-index:7;
    padding:34px 14px calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(0deg, rgba(6,8,14,.8), rgba(6,8,14,0));
    display:flex; flex-direction:column; gap:12px; align-items:center; }
  .presets { display:flex; gap:9px; }
  .preset { appearance:none; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06);
    color:rgba(238,240,245,.82); font-size:12px; padding:5px 15px; border-radius:999px; cursor:pointer; transition:.2s; }
  .preset.on { border-color:var(--gold); background:rgba(200,168,106,.2); color:#f4e6c8; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:44px; min-width:64px; padding:0 14px; border:1px solid rgba(255,255,255,.16); border-radius:14px;
    background:rgba(255,255,255,.08); backdrop-filter:blur(10px); color:#eef0f5; font-size:13px; cursor:pointer; transition:.18s; }
  .btn:active { transform:scale(.96); }
  .btn.on { border-color:var(--gold); background:rgba(200,168,106,.2); color:#f4e6c8; }
  /* 图标是 1em 见方的内联 SVG：display:flex 去掉 inline 元素的基线间隙，
     四个按钮的图标才会严丝合缝地落在同一条水平线上。 */
  .btn .ic { display:flex; font-size:17px; line-height:1; }
  /* 标签任何情况下都不许拆开：宽度不够时 320px 上「自动旋转」会被压成一字一行。
     实测 4 个按钮横排需要约 466px 视口；不够就整块换行，而不是把字掰断。 */
  .btn .tx { white-space:nowrap; }
  .presets { flex-wrap:wrap; justify-content:center; }
  .preset { white-space:nowrap; }
  /* 窄屏改成「图标在上、文字在下」——手机工具条的通行做法：
     既留住图标（去掉图标观感更差），又能让四个按钮在 320px 上排成一行。 */
  @media (max-width: 400px) {
    .actions { gap:8px; }
    .btn { flex-direction:column; gap:3px; height:auto; min-width:0; padding:7px 10px; border-radius:12px; }
    .btn .ic { font-size:18px; }
    .btn .tx { font-size:11px; line-height:1.2; }
  }

  /* 语音讲解 小型播放器（左上，标题下方） */
  .audio { position:absolute; left:16px; top:calc(env(safe-area-inset-top) + 88px); z-index:7;
    display:flex; align-items:center; gap:10px; width:min(300px,78vw); padding:8px 12px;
    background:rgba(20,22,32,.72); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.14); border-radius:14px;
    transition:width .22s ease, padding .22s ease; }
  .au-btn { flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--gold);
    background:rgba(200,168,106,.18); color:#f4e6c8; font-size:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.18s; }
  .au-btn:active { transform:scale(.94); }
  /* 折叠态：只剩一颗圆钮。手机竖屏这条 300px 的横条正压在器物上半身，
     收起来能把画面还给模型；点圆钮＝展开（不直接播放，避免在安静环境里误触出声）。 */
  .audio.mini { width:auto; padding:5px; gap:0; }
  .audio.mini .au-mid, .audio.mini .au-collapse { display:none; }
  .audio.mini .au-btn { width:38px; height:38px; font-size:14px; }
  .audio.mini.playing .au-btn { box-shadow:0 0 0 3px rgba(200,168,106,.28); }
  .au-collapse { flex:0 0 auto; width:22px; height:22px; border-radius:6px; border:1px solid rgba(255,255,255,.16);
    background:transparent; color:rgba(238,240,245,.7); font-size:11px; line-height:1; cursor:pointer; transition:.18s; }
  .au-collapse:hover { background:rgba(255,255,255,.1); color:#f4e6c8; }
  .au-mid { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .au-top { display:flex; align-items:center; gap:8px; font-size:11.5px; color:rgba(238,240,245,.82); }
  .au-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .au-sel { flex:1; min-width:0; background:transparent; border:none; color:#eef0f5; font-size:11.5px; font-family:inherit; outline:none; cursor:pointer; }
  .au-sel option { background:#14161f; color:#eef0f5; }
  .au-time { flex:0 0 auto; color:rgba(238,240,245,.6); font-variant-numeric:tabular-nums; }
  .au-bar { height:4px; border-radius:2px; background:rgba(255,255,255,.16); cursor:pointer; overflow:hidden; }
  .au-bar>i { display:block; width:0; height:100%; border-radius:2px; background:linear-gradient(90deg,var(--gold),#e6cf9a); transition:width .1s linear; }

  /* 信息面板（详情卡片）：底色由样式预设类控制 */
  .card { position:absolute; z-index:8; color:#eef0f5; opacity:0; pointer-events:none;
    transition:opacity .28s, transform .28s; }
  .card.show { opacity:1; pointer-events:auto; }
  .card-title { font-size:16px; font-weight:700; color:#f4e6c8; margin-bottom:8px; letter-spacing:.5px; }
  .card-body { font-size:13.5px; line-height:1.75; color:rgba(238,240,245,.92); }
  .card-close { position:absolute; top:12px; right:14px; font-size:20px; color:rgba(255,255,255,.6); cursor:pointer; line-height:1; }
  /* 浮动卡片（JS 定位在热点旁）：宽屏避让模型投影 + 右侧面板；窄屏就近夹取在视口内 */
  .card.float { width:min(300px, 86vw); padding:18px 20px; border-radius:16px; transform:scale(.92);
    transform-origin:var(--org, left center); }
  .card.float.show { transform:scale(1); }
  /* 面板样式预设：黑底 / 毛玻璃 / 透明 */
  .card.st-solid { background:rgba(20,22,32,.94); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1); box-shadow:0 18px 44px rgba(0,0,0,.5); }
  .card.st-glass { background:rgba(24,26,38,.5); backdrop-filter:blur(22px) saturate(1.3);
    border:1px solid rgba(255,255,255,.18); box-shadow:0 18px 44px rgba(0,0,0,.42); }
  .card.st-transparent { background:transparent; backdrop-filter:none; border:none; box-shadow:none;
    border-left:2px solid var(--gold); border-radius:0; padding-left:16px; }
  .card.st-transparent .card-title, .card.st-transparent .card-body {
    text-shadow:0 2px 10px rgba(0,0,0,.92), 0 0 3px rgba(0,0,0,.85); }
  .card.st-transparent .card-close { text-shadow:0 1px 6px rgba(0,0,0,.9); color:rgba(255,255,255,.85); }
  /* 描边：细金边 + 标题下短横，接近直角 */
  .card.st-outline { background:rgba(12,14,20,.42); backdrop-filter:blur(10px); border:1.5px solid var(--gold); border-radius:6px; box-shadow:0 12px 32px rgba(0,0,0,.45); }
  .card.st-outline .card-title { padding-bottom:9px; position:relative; }
  /* 短横用 ::before：::after 留给编辑模式的「· 可拖拽」提示。
     两者都挂 ::after 时，提示文字会继承这里的 absolute + 32×2px 尺寸，被裁成半行掉到标题下面。 */
  .card.st-outline .card-title::before { content:""; position:absolute; left:0; bottom:2px; width:32px; height:2px; background:var(--gold); border-radius:2px; }
  /* 色带标题：标题嵌在金色色带内，正文在深色区（版式不同） */
  .card.st-ribbon { background:rgba(18,20,29,.94); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.1); border-radius:14px; box-shadow:0 18px 44px rgba(0,0,0,.5); padding:0; overflow:hidden; }
  .card.st-ribbon .card-title { margin:0; padding:12px 20px; background:linear-gradient(90deg,var(--gold),#e6cf9a); color:#0b0d14; font-weight:800; }
  .card.st-ribbon .card-body { padding:14px 20px 18px; }
  .card.st-ribbon .card-close { color:#0b0d14; }
  /* 极简竖线：无框 + 左金竖线 + 渐隐深底 */
  .card.st-minimal { background:linear-gradient(90deg,rgba(9,11,16,.8),rgba(9,11,16,.28)); backdrop-filter:blur(6px); border:none; border-left:2px solid var(--gold); border-radius:0 12px 12px 0; box-shadow:none; }
  .card.st-minimal .card-title { font-size:14px; letter-spacing:1.5px; color:#f4e6c8; }
  .card.st-minimal .card-body { color:rgba(238,240,245,.82); }
  /* 引线 SVG */
  .hs-svg { position:absolute; inset:0; width:100%; height:100%; z-index:6; pointer-events:none; overflow:visible; }
  #hs-leader { stroke:var(--gold); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:miter; fill:none; opacity:.95;
    filter:drop-shadow(0 0 3px rgba(200,168,106,.5)); }
  #hs-leader.straight { stroke-width:1.3; opacity:.82; }
  #hs-dot { fill:var(--gold); filter:drop-shadow(0 0 4px rgba(200,168,106,.7)); }
  #hs-knee { fill:transparent; stroke:transparent; opacity:0; pointer-events:none; }
  body.edit-callout-knee .hs-svg { cursor:grab; }
  body.edit-callout-knee .hs-svg:active { cursor:grabbing; }
  body.edit-callout .hs-svg { pointer-events:auto; cursor:default; }
  body.edit-callout .card.ed-movable .card-title { cursor:grab; }
  body.edit-callout .card.ed-movable .card-title:active { cursor:grabbing; }
  body.edit-callout .card.ed-movable .card-title::after { content:' · 可拖拽'; font-size:11px; font-weight:400; color:rgba(244,230,200,.55); }

  /* 遮罩：加载 / 错误 */
  .overlay { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%, #1c2030 0%, #0b0d14 100%); transition:opacity .45s; }
  .overlay.fade { opacity:0; }
  .poster { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0;
    transform:scale(1.06); filter:blur(3px) brightness(.5); }
  .poster.on { opacity:1; }
  .ov-inner { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:15px; padding:0 32px; text-align:center; }
  .spin { width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,.16); border-top-color:var(--gold); animation:spin .9s linear infinite; }
  @keyframes spin { to{ transform:rotate(360deg) } }
  .ov-text { font-size:13px; letter-spacing:1px; color:rgba(238,240,245,.86); text-shadow:0 1px 8px rgba(0,0,0,.6); }
  .bar { width:180px; height:4px; border-radius:2px; background:rgba(255,255,255,.14); overflow:hidden; }
  .bar>i { display:block; width:0; height:100%; border-radius:2px; background:linear-gradient(90deg,var(--gold),#e6cf9a); transition:width .25s; }
  .err-ic { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:700; color:#0b0d14; background:var(--gold); }
  .err-btn { margin-top:4px; padding:9px 24px; border:1px solid var(--gold); border-radius:999px; background:transparent; color:#f4e6c8; font-size:13px; cursor:pointer; }

  /* EDITOR-CSS-START （导出仅观看版时整段剔除） */
  /* 编辑面板（?mode=edit） */
  .editor { position:absolute; top:0; right:0; bottom:0; width:300px; z-index:20; overflow-y:auto; overflow-x:hidden;
    background:rgba(14,16,24,.95); border-left:1px solid rgba(255,255,255,.1); padding:16px; font-size:12.5px;
    scrollbar-width:thin; scrollbar-color:rgba(200,168,106,.4) transparent; }
  .editor::-webkit-scrollbar { width:8px; }
  .editor::-webkit-scrollbar-track { background:transparent; }
  .editor::-webkit-scrollbar-thumb { background:rgba(200,168,106,.32); border-radius:4px; border:2px solid transparent; background-clip:padding-box; }
  .editor::-webkit-scrollbar-thumb:hover { background:rgba(200,168,106,.55); background-clip:padding-box; }
  .editor h3 { font-size:13px; color:var(--gold); margin:14px 0 8px; letter-spacing:.5px; }
  .editor h3:first-child { margin-top:0; }
  .ed-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:7px 0; color:#cfd3e0; }
  .ed-label { white-space:nowrap; flex:0 0 auto; }
  .ed-preset-name { flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .ed-preset-actions, .ed-row-actions { flex:0 0 auto; white-space:nowrap; }
  .editor .ed-row > select.ed-in { flex:0 1 auto !important; min-width:0 !important; max-width:64%; text-overflow:ellipsis; }
  .ed-row input[type=range]{ flex:1; min-width:0; accent-color:var(--gold); }
  /* 勾选框不给 accent-color 就是系统蓝，在这套金/深色面板里格外扎眼 */
  .editor input[type=checkbox] { accent-color:var(--gold); }
  .ed-row input[type=color]{ width:30px; height:22px; border:none; background:none; padding:0; cursor:pointer; flex:0 0 auto; }
  /* 滑条 + 数字输入 联动组件 */
  .ed-slider { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .ed-num { flex:0 0 auto; width:56px; padding:3px 6px; border:1px solid rgba(255,255,255,.14); border-radius:6px;
    background:rgba(255,255,255,.05); color:#eef0f5; font-size:11.5px; font-family:inherit; text-align:right;
    -moz-appearance:textfield; }
  .ed-num::-webkit-outer-spin-button, .ed-num::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .ed-num:focus { outline:none; border-color:var(--gold); }
  .ed-note { color:#8a90a6; line-height:1.6; margin:6px 0; }
  .ed-row.ed-dis { opacity:.45; }   /* 未启用覆盖时把那两行压下去，别让人以为能调 */
  .ed-sec { border:1px solid rgba(255,255,255,.08); border-radius:8px; margin:8px 0; padding:2px 10px; }
  .ed-sec summary { cursor:pointer; color:var(--gold); font-size:13px; font-weight:600; padding:8px 0; letter-spacing:.5px; list-style:none; }
  .ed-sec summary::-webkit-details-marker { display:none; }
  .ed-sec summary::before { content:"▸ "; }
  .ed-sec[open] summary::before { content:"▾ "; }
  .ed-in { width:100%; margin:5px 0; padding:7px 9px; border:1px solid rgba(255,255,255,.14); border-radius:7px;
    background:rgba(255,255,255,.05); color:#eef0f5; font-size:12px; font-family:inherit; }
  .editor select.ed-in { color:#eef0f5; }
  /* 原生下拉弹窗是系统浅底：option 显式配色兜底，color-scheme 让弹窗本体与其滚动条
     也转深色（「面板方位」有 10 项会出滚动条）。与 studio.html 的同名修复保持一致。 */
  select { color-scheme:dark; }
  select option { background:#14161f; color:#eef0f5; }
  textarea.ed-in { resize:vertical; min-height:76px; line-height:1.6; }
  .ed-file { display:block; text-align:center; margin:5px 0; padding:8px; border:1px dashed rgba(255,255,255,.22);
    border-radius:7px; color:#cfd3e0; cursor:pointer; font-size:12px; }
  .ed-hs-item { border:1px solid rgba(255,255,255,.08); border-radius:7px; padding:6px 8px; margin:7px 0; }
  .ed-hs-item b { color:var(--gold); }
  .editor a { cursor:pointer; color:var(--gold); text-decoration:none; }
  .ed-btn { width:100%; margin-top:6px; padding:9px; border:1px solid var(--gold); border-radius:8px;
    background:transparent; color:#f4e6c8; cursor:pointer; font-size:12.5px; }
  .ed-btn.ed-save { background:var(--gold); color:#0b0d14; font-weight:700; font-size:13.5px; padding:11px; }
  .ed-btn.ed-save:hover { background:#d8b877; }
  .ed-btn.ed-save:disabled { opacity:.6; cursor:default; }
  .ed-badge { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:21; background:rgba(200,168,106,.92); color:#0b0d14;
    font-size:11px; font-weight:700; padding:3px 12px; border-radius:999px; }
  /* 窄屏 sheet 顶栏：收起入口在 editor 内，勿抬升 HUD 以免挡住保存区 */
  .ed-sheet-head { display:none; }
  .ed-sheet-title { font-size:13px; font-weight:600; color:#f4e6c8; letter-spacing:.3px; }
  .ed-sheet-close { appearance:none; border:1px solid rgba(255,255,255,.18); border-radius:999px;
    background:rgba(255,255,255,.08); color:#eef0f5; font-size:12px; padding:5px 14px; cursor:pointer; }
  .ed-sheet-close:active { transform:scale(.96); }
  /* 窄屏编辑：底部 sheet + 可收起，避免 300px 右栏盖住 HUD/预设 */
  @media (max-width: 720px) {
    .editor { top:auto; left:0; right:0; bottom:0; width:100%; max-height:min(55vh, 520px);
      border-left:none; border-top:1px solid rgba(255,255,255,.1); border-radius:16px 16px 0 0;
      box-shadow:0 -8px 32px rgba(0,0,0,.45); }
    body.ed-narrow.ed-panel-collapsed .editor { display:none !important; }
    body.ed-narrow:not(.ed-panel-collapsed) .editor { display:flex !important; flex-direction:column; overflow:hidden; padding:0; }
    body.ed-narrow:not(.ed-panel-collapsed) .ed-sheet-head {

function focusTo(target, dist, dur, camOverride) {
  const startT = controls.target.clone(), startC = camera.position.clone()
  const endT = target.clone()
  const endC = camOverride || target.clone().add(camera.position.clone().sub(controls.target).normalize().multiplyScalar(dist))

  cancelAnimationFrame(focusAnim)
  const ease = x => x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2
  ;(function step(){
    const k = Math.min(1, (performance.now()-t0)/dur), e = ease(k)
    controls.target.lerpVectors(startT, endT, e)
    camera.position.lerpVectors(startC, endC, e)
    controls.update()
    if (k<1) focusAnim = requestAnimationFrame(step)
  })()
}

let modelLoadGeneration = 0
let modelPreviewOnly = false   // 本地 blob 预览：scene 已换但 cfg.assets.model 未改
let modelLoadMockEnabled = false
let modelLoadMockPending = []  // E2E：人工 resolve/reject 的待处理加载

function disposeObject3D(obj) {
  if (!obj) return
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose()
    if (!o.material) return
    ;[].concat(o.material).forEach(m => {
      if (!m) return
      for (const k of Object.keys(m)) {
        const v = m[k]
        if (v && v.isTexture) v.dispose()
      }
      m.dispose()
    })
  })
}

function applyLoadedModel(gltfScene, { loadTag = null } = {}) {
  if (loadTag != null) gltfScene.__loadTag = loadTag
  const prev = model
  if (prev && scene) scene.remove(prev)
  model = gltfScene
  normalize(model)
  applyMaterial()
  if (scene) scene.add(model)
  applyShadow()
  buildHotspots()
  if (prev && prev !== model) disposeObject3D(prev)
}

/** 换模型（支持任意 URL / 拖拽本地文件；跨域需 CORS）。仅 load 成功后 optional commitModelPath 才写入 config。 */
function reloadModel(url, opts = {}) {
  const { revoke = false, commitModelPath = null, loadTag = null } = opts
  const generation = ++modelLoadGeneration
  const previousPreviewOnly = modelPreviewOnly

  const settleSuccess = gltfScene => {
    if (generation !== modelLoadGeneration) {
      disposeObject3D(gltfScene)
      if (revoke) { try { URL.revokeObjectURL(url) } catch (_) {} }
      return { ok: true, stale: true }
    }
    applyLoadedModel(gltfScene, { loadTag })
    if (revoke) { try { URL.revokeObjectURL(url) } catch (_) {} }
    if (commitModelPath != null) {
      cfg.assets = cfg.assets || {}
      cfg.assets.model = commitModelPath
      modelPreviewOnly = false
    } else {
      modelPreviewOnly = true
    }
    if (window.__edRefresh) window.__edRefresh()
    return { ok: true, stale: false, committed: commitModelPath }
  }
  const settleError = err => {
    if (generation !== modelLoadGeneration) {
      if (revoke) { try { URL.revokeObjectURL(url) } catch (_) {} }
      return { ok: false, stale: true }
    }
    modelPreviewOnly = previousPreviewOnly
    if (revoke) { try { URL.revokeObjectURL(url) } catch (_) {} }
    throw err || new Error('model load failed')
  }

  if (editMode && modelLoadMockEnabled) {
    return new Promise((resolve, reject) => {
      modelLoadMockPending.push({
        url, generation, loadTag, commitModelPath, revoke,
        resolve: gltfScene => {
          try { resolve(settleSuccess(gltfScene)) } catch (e) { reject(e) }
        },
        reject: err => {
          try {
            const r = settleError(err)
            if (r?.stale) resolve(r)
            else reject(err || new Error('model load failed'))
          } catch (e) { reject(e) }
        },
      })
    })
  }

  return new Promise((resolve, reject) => {
    makeLoader().load(url, gltf => {
      try { resolve(settleSuccess(gltf.scene)) } catch (e) { reject(e) }
    }, undefined, err => {
      try {
        const r = settleError(err)
        if (r?.stale) resolve(r)
        else reject(err || new Error('model load failed'))
      } catch (e) { reject(e) }
    })
  })
}

function resolveModelLoadMock(tag) {
  const i = modelLoadMockPending.findIndex(x => x.loadTag === tag)
  if (i < 0) return false
  const entry = modelLoadMockPending.splice(i, 1)[0]
  const g = new THREE.Group()
  g.__loadTag = tag
  entry.resolve(g)
  return true
}

function rejectModelLoadMock(tag, message = 'mock load failed') {
  const i = modelLoadMockPending.findIndex(x => x.loadTag === tag)
  if (i < 0) return false
  const entry = modelLoadMockPending.splice(i, 1)[0]
  entry.reject(new Error(message))
  return true
}

function clearModelLoadMock() {
  modelLoadMockPending.length = 0
}

let _bootModelTimers = null

function finishPlayerReveal(gen) {
  if (gen !== _startGeneration || window.__SY_PLAYER.ready) return
  captureBootLightingSnapshot()
  $('topbar').removeAttribute('hidden'); $('hud').removeAttribute('hidden')
  $('loading').classList.add('fade'); setTimeout(()=>$('loading').setAttribute('hidden',''), 460)
  $('hint').classList.add('show'); setTimeout(()=>$('hint').classList.remove('show'), 2600)
  if (editMode && typeof buildEditor === 'function') buildEditor()
  markPlayerReady()
  animate()
}

function start() {
  clearTimeout(_bootWatchdog)
  const gen = ++_startGeneration
  envPanoramaBootPromise = null
  envPanoPrefetch = null
  bootLightingSnapshot = null
  scene = new THREE.Scene()
  scene.background = new THREE.Color(cfg.renderer?.background || '#0f1118')
  camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1000)
  controls = new OrbitControls(camera, renderer.domElement)
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false; controls.rotateSpeed = 0.9
  controls.addEventListener('start', ()=>{ controls.autoRotate=false; syncBtns() })
  bootEnvironment() // 先给内置环境/程序化预设，秒出反射
  applyEnvironment() // 环境光照强度 / 全景旋转
  const bootEnvSrc = resolveEnvSource(cfg)
  if (bootEnvSrc.kind === 'panorama') {
    const panoUrl = asset(bootEnvSrc.url)
    if (deferPanoramaIBL) prefetchPanoramaTexture(panoUrl)
    else kickPanoramaIBLIfNeeded()
  }
  buildLights() // 五光源灯组（叠加在 IBL 上，可编辑）

  const modelUrl = asset(cfg.assets.model)
  const fallbackUrl = sameOriginFallbackUrl(cfg.assets.model)
  if (!modelUrl) return failPlayer('模型地址无效', true)

  const modelTimers = createModelLoadTimers({
    idleMs: modelIdleTimeoutMs(cfg, window.__SY_PLAYER, null),
    totalMs: modelTotalTimeoutMs(cfg, window.__SY_PLAYER, null),
    onIdle: () => {
      if (window.__SY_PLAYER.ready || gen !== _startGeneration) return
      abortPendingBoot('模型加载超时，请检查网络后重试')
    },
    onTotal: () => {
      if (window.__SY_PLAYER.ready || gen !== _startGeneration) return
      abortPendingBoot(modelTimers.isDownloadComplete()
        ? '模型解析超时，请稍后重试或更换设备'
        : '模型加载超时，请检查网络后重试')
    },
    onDownloadComplete: () => {
      if (gen !== _startGeneration) return
      $('bar').style.width = '100%'
      $('load-text').textContent = '正在解析模型…'
    },
  })
  _bootModelTimers = modelTimers
  modelTimers.start()

  const onModelLoaded = gltf => {
    modelTimers.clear()
    _bootModelTimers = null
    if (gen !== _startGeneration || window.__SY_PLAYER.ready) return
    model = gltf.scene
    try {
      normalize(model); applyMaterial(); scene.add(model); applyShadow()
      placeCamera(); buildHotspots(); buildHUD(); renderText(); buildAudio(); wireAudio()
    } catch {
      failPlayer('展品配置无法解析，请检查热点数据后重试', true)
      return
    }
    void (async () => {
      try {
        await waitForPanoramaBootBeforeReveal(gen)
      } catch { /* panoramaIBL resolves fallback; unexpected throw still reveal */ }
      if (gen !== _startGeneration || window.__SY_PLAYER.ready) return
      if (model) applyMaterial()
      finishPlayerReveal(gen)
    })()
  }
  const onModelProgress = evt => {
    if (gen !== _startGeneration) return
    modelTimers.progress(evt.loaded, evt.total)
    if (modelTimers.isDownloadComplete()) return
    if (evt.total) { const p=Math.min(100,Math.round(evt.loaded/evt.total*100)); $('bar').style.width=p+'%'; $('load-text').textContent=`正在加载模型… ${p}%` }
    else if (typeof evt.loaded === 'number' && evt.loaded > 0) { $('load-text').textContent=`正在加载模型… ${evt.loaded} B` }
  }
  const beginModelLoad = (url, canFallback) => {
    makeLoader().load(url, onModelLoaded, onModelProgress, () => {
      if (gen !== _startGeneration) return
      if (canFallback && fallbackUrl && fallbackUrl !== url) {
        $('bar').style.width = '0%'
        $('load-text').textContent = 'CDN 未通，改走工作台模型…'
        modelTimers.start()
        beginModelLoad(fallbackUrl, false)
        return
      }
      modelTimers.clear()
      _bootModelTimers = null
      failPlayer('模型加载失败，请检查网络后重试', true)
    })
  }
  beginModelLoad(modelUrl, true)

  addEventListener('resize', onResize)
  // 退出全屏的路子不止按钮一条（Esc、系统手势、浏览器 UI），一律回来重画按钮状态
  for (const ev of ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange']) {
    document.addEventListener(ev, syncBtns)
  }
  $('card-close').onclick = closeHotspot
  $('card-close').addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); closeHotspot() } })
  $('scene').addEventListener('pointerdown', ()=>{ if($('card').classList.contains('show')) return })
  // 键盘快捷键：Esc 关面板 · 空格 播/暂停语音
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (activeHS || cardShowTimer) closeHotspot() }
    else if (e.key === ' ' || e.code === 'Space') {
      const tag = (e.target?.tagName || '').toLowerCase()
      if (tag==='input' || tag==='textarea' || tag==='select' || tag==='button' || tag==='a') return  // 不干扰控件/输入
      if (auTracks.length) { e.preventDefault(); const a=$('au-el'); a.paused ? a.play().catch(()=>{}) : a.pause() }
    }
  })
}

let _bootInflight = false
async function boot() {
  if (_bootInflight) return
  _bootInflight = true
  const gen = ++_bootGeneration
  window.__SY_PLAYER.bootStarted = true
  window.__SY_PLAYER.ready = false
  window.__SY_PLAYER.failed = false
  scheduleBootWatchdog(gen)
  $('error').setAttribute('hidden',''); $('loading').removeAttribute('hidden'); $('loading').classList.remove('fade')
  try {
    if (window.__CFG__) cfg = window.__CFG__            // 便携单文件：内联配置，免 fetch（可双击 file:// 打开）
    else {
      const url = configFetchUrl(BASE)
      const res = await fetchWithTimeout(url, configTimeoutMs(null, window.__SY_PLAYER, null))
      if (!res.ok) throw new Error(`HTTP ${res.status} · ${url}`)
      cfg = await res.json()
    }
    if (gen !== _bootGeneration) return
    /* VIEWER-BOOT-HOTSPOT-START — build-viewer 替换为 ensureHotspotIds */
    if (editMode) {
      hotspotIdBootAudit = null
      hotspotIdBootChanges = []
      const boot = bootstrapHotspotIds(cfg.hotspots || [])
      hotspotIdBootAudit = boot.audit
      hotspotIdBootChanges = boot.changes
    } else {
      ensureHotspotIds(cfg.hotspots || [])
    }
    /* VIEWER-BOOT-HOTSPOT-END */
    if (!cfg?.assets?.model) { failPlayer('配置无效：缺少 assets.model（'+BASE+'config.json 未正确返回展品数据）', true); return }
    if (!initRenderer()) { failPlayer('当前浏览器不支持 3D 展示，请更换浏览器或升级微信', false); return }
    document.title = t(cfg.i18n).title || '立体鉴赏'
    if (cfg.assets.poster) applyPoster(cfg.assets.poster)
    if (editMode) $('ed-badge').removeAttribute('hidden')
    start()
  }
  catch(e){
    if (gen !== _bootGeneration) return
    const msg = (e?.name === 'AbortError')
      ? '配置加载超时，请检查网络后重试'
      : '配置加载失败：'+e.message+'（请从 exhibits 目录启动 HTTP 服务，并确认 ?ex= 参数正确）'
    failPlayer(msg, true)
  }
  finally { _bootInflight = false }
}

  /* 编辑器是横屏，看不到手机效果——把反解出来的数值如实写出来，让操作者能核对。
   同时说明它在当前（横屏）视口不生效，免得以为滑条坏了。 */
/** 当前模型的包围盒尺寸（宽取 x/z 的较大者，与 autoFitDistance 保持同一口径） */
function fitBoxSize() {
  if (!model) return null
  const s = modelBox.getSize(new THREE.Vector3())
  return s.y > 0 ? { width: Math.max(s.x, s.z), height: s.y } : null
}
/** 某机型上的取景结论。fill=0（关闭）时如实反映「沿用默认距离」，而不是按贴边取景算。 */
function fitOnDevice(dev) {
  const box = fitBoxSize(); if (!box || !dev) return null
  const c = cfg.camera || {}
  const fill = portraitFillTarget(cfg)
  const fovDeg = num(c.fov, 40)
  if (!fill) {
    const distance = num(c.distance, 3.4)
    const aspect = dev.w / dev.h
    return { off: true, aspect, distance, rawDistance: distance, clamped: false,
      coverage: framingCoverage({ ...box, fovDeg, aspect, distance }) }
  }
  return devicePreviewFit({ ...box, fovDeg, device: dev, fill,
    minDistance: num(c.minDistance, 1.4), maxDistance: num(c.maxDistance, 7) })
}
function syncFitNote() {
  const el = document.getElementById('ed-fit-note'); if (!el) return
  const fill = portraitFillTarget(cfg)
  if (!fill) { el.textContent = '已关闭竖屏自动取景，手机上沿用上面的默认距离。'; return }
  const parts = [`竖屏（宽高比 < 1）时自动按包围盒反解相机距离，让器物占屏 ${Math.round(fill * 100)}%；横屏与桌面不受影响，仍用保存的默认视角。`]
  // 取一手机一平板做代表；完整的五档在「机型取景预览」里逐台看
  for (const id of ['ph-m', 'pad-s']) {
    const dev = previewDevice(id)
    const f = fitOnDevice(dev)
    if (!f) continue
    parts.push(`${dev.label} ${dev.w}×${dev.h} → 距离 ${f.distance.toFixed(2)}${f.clamped ? '（已被最近/最远距离夹住）' : ''}`)
  }
  el.innerHTML = parts.join('<br>')
}

/* ---------- 机型取景预览 ----------
   画面并不是另开一个渲染器，而是用同一个 renderer 在主画布上多画一块小视口
   （setScissor + setViewport），再逐帧拷进卡片自己的 2D 画布。
   那块小视口就摆在卡片里 .dp-cv 的位置上——.dp-cv 是不透明的，把它完全盖住，
   所以既不会有底噪透出，也绕开了「卡片中空」必然遇到的层级问题：
   热点(z4)、引线(z6)、信息卡(z8)都在主画布之上，会压在预览画面上。 */
/* want = 用户的意图，与「此刻是否真的显示」分开记：窗口收窄/压扁时预览要让位，
   但意图得留着，窗口一还原就自己回来，而不是逼用户再勾一次。 */
const DP = { want: false, id: DEFAULT_PREVIEW_DEVICE, ctx: null, frame: 0, cssW: 0, cssH: 0 }
const DP_EVERY = 4          // 每 4 帧出一次图：预览不需要 60fps，省掉四分之三的额外绘制
const DP_MIN_H = 560        // 再矮就要压到左上角的语音条上了
let dpCam = null

// renderEditor() 里那个 esc 是它的局部函数，这里够不着；机型表是源码常量，
// 转义纯属防御，但别为了省这一行就往 innerHTML 里塞未转义的字符串。
const dpEsc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')
function dpDevice() { return previewDevice(DP.id) }
function dpVisible() { return DP.want && innerWidth > ED_PANEL_NARROW_MAX && innerHeight >= DP_MIN_H }

function dpSyncChips() {
  const box = document.getElementById('dp-chips'); if (!box) return
  box.innerHTML = PREVIEW_DEVICES.map(d =>
    `<button type="button" class="dp-chip${d.id === DP.id ? ' on' : ''}" data-dp="${d.id}"` +
    ` title="${dpEsc(d.label)} · ${d.w} × ${d.h} · ${dpEsc(d.hint)}">${dpEsc(d.short)}</button>`).join('')
  box.querySelectorAll('[data-dp]').forEach(b => {
    b.onclick = () => { DP.id = b.dataset.dp; dpSyncChips(); dpLayout(); dpSyncRead() }
  })
}

/** 按当前舞台可用空间与机型比例定出「屏」的尺寸。舞台尺寸固定，换机型只改屏的形状，卡片不跳。 */
function dpLayout() {
  const cv = document.getElementById('dp-cv')
  const bezel = document.getElementById('dp-bezel')
  if (!cv || !bezel || !dpVisible()) return
  const stage = bezel.parentElement
  const cs = getComputedStyle(bezel)
  const chromeW = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) * 2
  const chromeH = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) * 2
  const availW = Math.max(40, stage.clientWidth - chromeW)
  const availH = Math.max(40, stage.clientHeight - chromeH)
  const dev = dpDevice()
  const ar = dev.w / dev.h
  const w = Math.floor(Math.min(availW, availH * ar))
  const h = Math.floor(w / ar)
  if (!(w > 0 && h > 0)) return
  if (w === DP.cssW && h === DP.cssH) return   // 没变就别写样式，免得 ResizeObserver 自激
  DP.cssW = w; DP.cssH = h
  cv.style.width = w + 'px'
  cv.style.height = h + 'px'
  // 后备存储用渲染器自己的 pixelRatio，拷贝时才是 1:1，不经重采样
  const dpr = renderer ? renderer.getPixelRatio() : (devicePixelRatio || 1)
  const bw = Math.max(1, Math.round(w * dpr)), bh = Math.max(1, Math.round(h * dpr))
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh }
  if (!DP.ctx) DP.ctx = cv.getContext('2d')
}

function pct(v) { return Math.round(v * 100) + '%' }
function dpSyncRead() {
  const el = document.getElementById('dp-read'); if (!el) return
  // 逐帧调用，内容没变就不碰 DOM，免得每秒十几次无谓的重排
  const dev = dpDevice()
  const ratio = (dev.h / dev.w).toFixed(2)
  const f = fitOnDevice(dev)
  const lines = [`${dev.w} × ${dev.h}　比例 1 : ${ratio}`]
  if (!f) {
    lines.push('模型未就绪')
  } else {
    // 谁先顶满谁说了算：把绑定的那条轴挑成金色，一眼看出滑条上的数字落在哪一边
    const bindH = f.coverage.h >= f.coverage.w
    const ax = (on, v) => `<b class="${on ? 'pin' : ''}">${pct(v)}</b>`
    lines.push(`距离 <b>${f.distance.toFixed(2)}</b>　占屏 高 ${ax(bindH, f.coverage.h)} · 宽 ${ax(!bindH, f.coverage.w)}`)
    if (f.off) lines.push('<span class="warn">竖屏自动取景已关闭，沿用默认距离</span>')
    else if (f.clamped) lines.push('<span class="warn">已被最近/最远距离夹住</span>')
  }
  const html = lines.join('<br>')
  if (html === DP.lastRead) return
  DP.lastRead = html
  el.innerHTML = html
}

/** 逐帧出图。挂在 animate() 之后，读的是本帧已经画完的主画布。 */
function dpTick() {
  if (!dpVisible() || !renderer || !camera || !controls) return
  if ((DP.frame++ % DP_EVERY) !== 0) return
  const cv = document.getElementById('dp-cv')
  if (!cv || !DP.ctx || !(DP.cssW > 1) || !(DP.cssH > 1)) return
  const dev = dpDevice()
  const f = fitOnDevice(dev)
  const target = controls.target
  const dist = f ? f.distance : camera.position.distanceTo(target)
  if (!(dist > 0)) return

  // 预览相机只替换「距离」与「宽高比」，方位角随用户当前视角走，拖动时预览跟着转
  if (!dpCam) dpCam = new THREE.PerspectiveCamera(40, 1, 0.1, 1000)
  dpCam.fov = num(cfg.camera?.fov, 40)
  dpCam.aspect = dev.w / dev.h
  dpCam.near = camera.near; dpCam.far = camera.far
  dpCam.updateProjectionMatrix()
  const off = camera.position.clone().sub(target)
  if (off.lengthSq() === 0) off.set(0, 0, 1)
  dpCam.position.copy(target).add(off.setLength(dist))
  dpCam.up.copy(camera.up)
  dpCam.lookAt(target)

  const canvasRect = renderer.domElement.getBoundingClientRect()
  const cvRect = cv.getBoundingClientRect()
  const x = cvRect.left - canvasRect.left
  const yTop = cvRect.top - canvasRect.top
  // WebGL 视口的 y 从画布底边往上量
  const y = canvasRect.height - yTop - DP.cssH
  if (x < 0 || y < 0 || x + DP.cssW > canvasRect.width + 1 || yTop + DP.cssH > canvasRect.height + 1) return

  // renderer.info.render 每次 render() 都会重置，编辑器的性能面板读的就是它。
  // 不还原的话，开着预览时面板有四分之一的采样落在这块小视口上，Draw 数忽大忽小。
  const infoSnap = { ...renderer.info.render }
  const shadowAuto = renderer.shadowMap.autoUpdate
  renderer.shadowMap.autoUpdate = false   // 阴影贴图本帧主渲染已更新过，别再来一遍
  renderer.setScissorTest(true)
  renderer.setViewport(x, y, DP.cssW, DP.cssH)
  renderer.setScissor(x, y, DP.cssW, DP.cssH)
  renderer.render(scene, dpCam)
  renderer.setScissorTest(false)
  renderer.setViewport(0, 0, canvasRect.width, canvasRect.height)
  renderer.shadowMap.autoUpdate = shadowAuto
  Object.assign(renderer.info.render, infoSnap)

  const dpr = renderer.getPixelRatio()
  DP.ctx.drawImage(renderer.domElement,
    Math.round(x * dpr), Math.round(yTop * dpr), cv.width, cv.height,
    0, 0, cv.width, cv.height)
  dpSyncRead()
}

function setDevicePreview(on, { quiet = false } = {}) {
  DP.want = !!on
  const box = document.querySelector('#editor #ed-devpreview')
  if (box) box.checked = DP.want
  const card = document.getElementById('dev-preview')
  if (!card) return
  const vis = dpVisible()
  card.hidden = !vis
  devicePreviewTick = vis ? dpTick : null
  if (!vis) {
    if (DP.want && !quiet) flash(`窗口太小：机型取景预览需要至少 ${ED_PANEL_NARROW_MAX + 1} × ${DP_MIN_H}`)
    return
  }
  dpSyncChips()
  // 先填读数再量舞台：读数为空时舞台会多分到 50 多像素，屏会撑破卡片压住下面那行
  dpSyncRead()
  requestAnimationFrame(() => {
    dpSyncRead()
    dpLayout()
    // 上面两句（先填读数、再量舞台）已经够让首屏正确了（已用 e2e 反向验证）。
    // 观察者是兜底：字体加载完、机型条换行数变了都会改舞台可用空间，
    // 别再依赖「某一帧量到的值刚好是最终值」。
    const stage = document.getElementById('dp-bezel')?.parentElement
    if (stage && !DP.ro && typeof ResizeObserver === 'function') {
      DP.ro = new ResizeObserver(() => dpLayout())
      DP.ro.observe(stage)
    }
  })
}
// 窗口变化时按意图重算可见性：静默，否则拖窗口会一路弹提示
devicePreviewResync = () => { if (DP.want) setDevicePreview(true, { quiet: true }) }

function wireEditor() {
  const el = id => document.getElementById(id)
  const g=cfg.materials.global, m=cfg.model, c=cfg.camera, L=cfg.lights
  const ed = $('editor')
  const sheetClose = el('ed-sheet-close')
  if (sheetClose) sheetClose.onclick = () => { window.__edPanelUserToggled = true; setEditorPanelCollapsed(true) }
  // 灯光：l.<灯名>.<i|az|el>（强度 / 方位角 / 仰角），关闭的灯写配置但送 0 给渲染
  function syncLightIntensity(k){ if (lightRefs[k]) lightRefs[k].intensity = effectiveIntensity(k, cfg.lights[k]) }
  function syncLightAndShadow(k) {
    syncLightIntensity(k)
    if (k === SHADOW_CASTER) applyShadow()
    syncShadowHint()
  }
  function applyLight(k, what, v){
    const c = cfg.lights[k] = cfg.lights[k] || {}
    if (what === 'i') { c.intensity = v }
    else {
      c.position = withAngle(c, k, what, v)
      if (lightRefs[k]) lightRefs[k].position.set(c.position[0], c.position[1], c.position[2])
    }
    syncLightAndShadow(k)
  }
  function setShadow(key, v){ cfg.shadow = cfg.shadow || {}; cfg.shadow[key] = v; applyShadow() }
  // 主光被关掉 / 转到水平面以下时，地面接不到影子——就地提示，不整段重绘
function syncShadowHint(){
    const el = document.getElementById('ed-shadow-warn'); if (!el) return
    el.innerHTML = (resolveShadow(cfg).enabled && !shadowWillLand(cfg))
      ? '<b style="color:#e0b070">当前主光已关闭或在水平面以下，只剩接触阴影，没有方向性投影。</b>' : ''
  }
  function applyRange(k, v){
    const lm = /^l\.(ambient|key|fill|rim|bounce)\.(i|az|el)$/.exec(k)
    if (lm) return applyLight(lm[1], lm[2], v)
    switch(k){
      case 'e.int': cfg.environment.intensity=v; applyEnvironment(); break
      case 'e.rot': cfg.environment.rotationDeg=v; applyEnvironment(); break
      case 'sh.opacity': setShadow('opacity', v); break
      case 'sh.soft': setShadow('softness', v); break
      case 'sh.offset': setShadow('groundOffset', v); break
      case 'g.exposure': applyExposureToCfg(cfg, v); renderer.toneMappingExposure = v; break
      case 'g.metal': g.metalness=v; applyMaterial(); break
      case 'g.rough': g.roughness=v; applyMaterial(); break
      case 'm.scale': m.scale=v; normalize(model); break
      case 'm.size': m.targetSize=v; normalize(model); break
      case 'm.px': m.position=[v,(m.position||[0,0,0])[1],(m.position||[0,0,0])[2]]; normalize(model); break
      case 'm.py': m.position=[(m.position||[0,0,0])[0],v,(m.position||[0,0,0])[2]]; normalize(model); break
      case 'm.pz': m.position=[(m.position||[0,0,0])[0],(m.position||[0,0,0])[1],v]; normalize(model); break
      case 'm.ry': m.rotationDeg=[(m.rotationDeg||[0,0,0])[0],v,(m.rotationDeg||[0,0,0])[2]]; normalize(model); break
      case 'c.fov': c.fov=v; camera.fov=v; camera.updateProjectionMatrix(); break
      case 'c.rspeed': c.autoRotateSpeed=v; controls.autoRotateSpeed=v; break
      case 'c.min': c.minDistance=v; controls.minDistance=v; break
      case 'c.max': c.maxDistance=v; controls.maxDistance=v; break
      case 'c.pfill': c.portraitFill=v; placeCamera(); syncFitNote(); break
      case 'c.pivy': c.pivot=[(c.pivot||[0,0,0])[0], v, (c.pivot||[0,0,0])[2]]; pivot.set(c.pivot[0],c.pivot[1],c.pivot[2]); if(!activeHS){ controls.target.copy(pivot); controls.update() } break
      case 'hs.size': cfg.hotspotStyle=cfg.hotspotStyle||{}; cfg.hotspotStyle.size=v; buildHotspots(); break
      case 'leader.gap': cfg.panel=cfg.panel||{}; cfg.panel.leaderGap=v; clearLeaderParams(); break
      case 'leader.tail': cfg.panel=cfg.panel||{}; cfg.panel.leaderTail=v; clearLeaderParams(); break
      case 'ov.metal': upsertOverride('metalness'); break
      case 'ov.rough': upsertOverride('roughness'); break
    }
  }
  // 滑条 → 联动数字框
  ed.querySelectorAll('input[type=range]').forEach(inp => inp.oninput = e => {
    const k=inp.dataset.k, v=parseFloat(e.target.value)
    const n=ed.querySelector(`.ed-num[data-num="${k}"]`); if(n) n.value=v
    applyRange(k,v)
  })
  // 数字框 → 联动滑条（输入时按范围夹取应用，失焦时回填夹取后的值）
  ed.querySelectorAll('.ed-num').forEach(inp => {
    inp.oninput = () => {
      const k=inp.dataset.num; let v=parseFloat(inp.value); if(isNaN(v)) return
      const mn=parseFloat(inp.min), mx=parseFloat(inp.max)
      if(!isNaN(mn)&&v<mn)v=mn; if(!isNaN(mx)&&v>mx)v=mx
      const r=ed.querySelector(`input[type=range][data-k="${k}"]`); if(r) r.value=v
      applyRange(k,v)
    }
    inp.onchange = () => { let v=parseFloat(inp.value); if(isNaN(v)){ return }
      const mn=parseFloat(inp.min), mx=parseFloat(inp.max)
      if(!isNaN(mn)&&v<mn)v=mn; if(!isNaN(mx)&&v>mx)v=mx; inp.value=v }
  })
  $('editor').querySelectorAll('input[type=color]').forEach(inp => inp.oninput = e => {
    const k=inp.dataset.k, col=new THREE.Color(e.target.value)
    const lm=/^l\.(ambient|key|fill|rim|bounce)\.c$/.exec(k||'')
    if(lm){ const n=lm[1]; L[n]=L[n]||{}; L[n].color=e.target.value; if(lightRefs[n]) lightRefs[n].color.copy(col) }
    if(k==='sh.plateColor'){ cfg.shadow=cfg.shadow||{}; cfg.shadow.plateColor=e.target.value; applyShadow() }
    if(k==='hs.color'){ cfg.hotspotStyle=cfg.hotspotStyle||{}; cfg.hotspotStyle.color=e.target.value; buildHotspots() }
  })
  // 灯光：单灯启用 / 跟随相机 / 亮度诊断 / 恢复出厂
  ed.querySelectorAll('[data-lon]').forEach(cb => cb.onchange = e => {
    const k=cb.dataset.lon; cfg.lights[k]=cfg.lights[k]||{}; cfg.lights[k].enabled=e.target.checked; syncLightAndShadow(k) })
  { const c2=document.getElementById('ed-shadow-on')
    if(c2) c2.onchange=e=>{ cfg.shadow=cfg.shadow||{}; cfg.shadow.enabled=e.target.checked; applyShadow(); syncShadowHint() } }
  { const c3=document.getElementById('ed-shadow-plate')
    if(c3) c3.onchange=e=>{ cfg.shadow=cfg.shadow||{}; cfg.shadow.plate=e.target.checked; applyShadow() } }
  syncShadowHint()
  syncFitNote()
  { const s2=document.getElementById('ed-env-preset')
    if(s2) s2.onchange=e=>{ cfg.environment.preset=e.target.value
      if (!supportsVisibleBackgroundForSource({ kind: e.target.value === 'room' ? 'room' : 'preset', preset: e.target.value }))
        cfg.environment.visibleBackground = false
      applyEnvironmentIBL(); applyEnvironment(); applyVisibleBackgroundPreview(); renderEditor() } }
  { const b2=document.getElementById('ed-pano-clear')
    if(b2) b2.onclick=()=>{
      if(!confirm('清除全景图地址、改用上方的环境预设？')) return

      cfg.environment.preset = ENV_PRESETS[cfg.environment.preset] ? cfg.environment.preset : 'studio'
      applyEnvironmentIBL(); applyEnvironment(); renderEditor(); flash('已切换到环境预设，记得点保存') } }
  { const f=document.getElementById('ed-light-follow')
    if(f) f.onchange=e=>{ cfg.lights.followCamera=e.target.checked; updateLightRig() } }
  { const b=document.getElementById('ed-light-diag'), o=document.getElementById('ed-light-diagout')
    if(b&&o) b.onclick=()=>{

      o.innerHTML=brightnessReport(); o.dataset.on='1'; b.textContent='收起诊断 ▴' } }
  { const b=document.getElementById('ed-light-reset')
    if(b) b.onclick=()=>{ if(!confirm('把四组光源恢复到出厂强度、颜色与角度？（其它设置不变）')) return
      cfg.lights=defaultLights(); buildLights(); renderEditor(); flash('已恢复出厂灯光') } }
  const bg=$('editor').querySelector('[data-k="e.bg"]'); if(bg) bg.onchange=e=>{ cfg.environment.visibleBackground=e.target.checked; applyVisibleBackgroundPreview() }
  const pulseCb=$('editor').querySelector('[data-k="hs.pulse"]'); if(pulseCb) pulseCb.onchange=e=>{ cfg.hotspotStyle=cfg.hotspotStyle||{}; cfg.hotspotStyle.pulse=e.target.checked; buildHotspots() }
  // 用户端按钮显隐
  $('editor').querySelectorAll('[data-ui]').forEach(cb=>cb.onchange=e=>{ cfg.ui=cfg.ui||{}; cfg.ui[cb.dataset.ui]=e.target.checked; buildHUD_refresh() })

  // 基本信息：标题 / 副标题（实时更新左上角）
  const bindInfo=(id,key)=>{ const i=el(id); if(i) i.oninput=e=>{ cfg.i18n=cfg.i18n||{}; cfg.i18n.zh=cfg.i18n.zh||{}; cfg.i18n.zh[key]=e.target.value; renderText() } }
  bindInfo('ed-title','title'); bindInfo('ed-subtitle','subtitle')
  { const c=el('ed-showtitle'); if(c) c.onchange=e=>{ cfg.ui=cfg.ui||{}; cfg.ui.showTitle=e.target.checked; renderText() } }
  const ps=el('ed-panel-style'); if(ps){ ps.value=(cfg.panel?.style)||'solid'; ps.onchange=e=>{ cfg.panel=cfg.panel||{}; cfg.panel.style=e.target.value
    if (activeHS || cardShowTimer) applyCardPanelStyle(e.target.value) } }
  const lz=el('ed-leader'); if(lz){ lz.value=(cfg.panel&&(cfg.panel.leader==='straight'||cfg.panel.leader==='line'))?'straight':'elbow'; lz.onchange=e=>{ cfg.panel=cfg.panel||{}; cfg.panel.leader=e.target.value; syncLeaderEditorUI(); bumpLeader() } }

function startHsDrag(e, hs){

  const ray=new THREE.Raycaster(), m2=new THREE.Vector2()

    if(Math.abs(ev.clientX-hsDrag.sx)+Math.abs(ev.clientY-hsDrag.sy)>4) hsDrag.moved=true
    if(!hsDrag.moved || !model) return
    m2.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1)
    ray.setFromCamera(m2,camera); const hit=ray.intersectObject(model,true)[0]; if(!hit) return

    hs.anchor.position.copy(model.worldToLocal(hit.point.clone()))
  }
  const up=()=>{
    removeEventListener('pointermove',move); removeEventListener('pointerup',up)
    controls.enabled=true
    const dragged = hsDrag && hsDrag.moved; hsDrag=null
    if(!dragged) openHotspot(hs.data, hs.el)              // 没拖动 = 点击 = 打开
    else if(window.__edRefresh) window.__edRefresh()      // 拖完刷新编辑器里的位置数字
  }
  addEventListener('pointermove',move); addEventListener('pointerup',up)
}
